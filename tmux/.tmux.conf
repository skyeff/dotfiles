# ~/.tmux.conf

# Prefix: Ctrl-a (mais próximo de Vim, mas podes trocar para o teu gosto)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Pane splitting (igual ao Vim: | e -)
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Navegação entre panes com hjkl
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Redimensionamento com Alt + hjkl
bind -n M-h resize-pane -L 5
bind -n M-j resize-pane -D 5
bind -n M-k resize-pane -U 5
bind -n M-l resize-pane -R 5

# Copiar no estilo Vim
setw -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel
bind-key -T copy-mode-vi 'Escape' send -X cancel

# Trocar entre janelas com números (prefix + número)
bind -r C-h previous-window
bind -r C-l next-window

set -g status on
set -g status-interval 5
set -g status-left-length 50
set -g status-right-length 150

# Nome da sessão à esquerda
set -g status-left "#[fg=green]#S #[default]"

# Script externo para a barra
set -g status-right "#(~/scripts/tmux-status.sh)"

