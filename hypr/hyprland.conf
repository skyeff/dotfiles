################
### MONITORS ###
################

# Guide https://wiki.hyprland.org/Configuring/Monitors/
monitor= eDP-1 ,preferred, auto, 1
monitor= HDMI-A-1, preferred, auto, auto

###################
### MY PROGRAMS ###
###################

# Guide https://wiki.hyprland.org/Configuring/Keywords/

$terminal = kitty
$fileManager = Thunar 
$menu = albert toggle
$lockscreen = hyprlock
$browser = zen-browser-bin

#################
### AUTOSTART ###
#################

exec-once = avizo-service
exec-once = dbus-run-session waybar &
exec-once = sleep 50 && hyprctl reload
exec-once = swww-daemon
exec-once = albert
exec-once = swww img /home/skye/Imagens/Wallpapers/Desktop/367.png

#############################
### ENVIRONMENT VARIABLES ###
#############################

# Guide https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# Configurações para Albert no Wayland
env = QT_QPA_PLATFORM,wayland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland

# Ou usando Alt+Space (mais tradicional)
bind = ALT, SPACE, exec, albert toggle

windowrulev2 = noborder, class:^(albert)$
windowrulev2 = noshadow, class:^(albert)$
windowrulev2 = noblur, class:^(albert)$
windowrulev2 = float, class:^(albert)$
windowrulev2 = center, class:^(albert)$

#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 4
    gaps_out = 1

    border_size = 1

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(0,0,0,1)
    col.inactive_border = rgba(0,0,0,1)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# Guide https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 7

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 8
        render_power = 3
        color = rgba(0, 0, 0, 0.7)   # Cor da sombra (RGBA) - preto semi-transparente
        offset = 3 3                 # Deslocamento X Y da sombra
    }

    # Guide https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 10
        passes = 4
        blurls = waybar
        vibrancy = 0.1696
        new_optimizations = true
        xray = false
    }
}

# Guide https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more
    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 2.94, almostLinear, slide
    animation = workspacesOut, 1, 2.94, almostLinear, slide
}

# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrulev2 = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrulev2 = rounding 0, floating:0, onworkspace:w[tv1]
# windowrulev2 = bordersize 0, floating:0, onworkspace:f[1]
# windowrulev2 = rounding 0, floating:0, onworkspace:f[1]

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}

# Ativa o blur globalmente
decoration:blur:enabled = true
decoration:blur:size = 3       
decoration:blur:passes = 3

# Desativa blur em todas as janelas que não sejam o kitty
windowrule = noblur, class:^(?!kitty).*

# Definindo Cursor
env = HYPRCURSOR_THEME, macOS 
env = HYPRCURSOR_SIZE, 23
env = XCURSOR_THEME, macOS
env = XCURSOR_SIZE, 23

exec-once = hyprctl setcursor apple_cursor 24

#############
### INPUT ###
#############

env = WLR_NO_HARDWARE_CURSORS, 1

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = br
    kb_variant = abnt2
    kb_model =
    kb_options = nodeadkeys
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
#gestures {
#    workspace_swipe = false
#}

# Example per-device config
# See https://wiki.hprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
    name = atml3000:00-03eb:2168-touchpad
    sensitivity = 0.5
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, M, exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, SPACE, togglefloating,
bind = $mainMod, P, exec, $browser
# bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod SHIFT, L, exec, $lockscreen

# Move focus with mainMod + arrow keys (brings window to front in floating mode)
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r  
bind = $mainMod, j, movefocus, d
bind = $mainMod, k, movefocus, u

# Alternative: Use cyclenext for cycling through windows (good for both modes)
bind = $mainMod, Tab, cyclenext, 

# Additional bindings for better window management
bind = $mainMod, F, bringactivetotop  # Manually bring active window to front
bind = $mainMod SHIFT, F, focusCurrentOrLast  # Toggle between current and last focused window

# Window rules to ensure proper focus behavior
windowrulev2 = stayfocused, floating:1  # Keep floating windows focused when clicked

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Volume com Avizo OSD
# binde = , XF86AudioRaiseVolume, exec, volumectl -u up
# binde = , XF86AudioLowerVolume, exec, volumectl -u down  
# binde = , XF86AudioMute, exec, volumectl toggle-mute
# binde = , XF86AudioMicMute, exec, volumectl -m toggle-mute

# Brilho com Avizo OSD
# binde = , XF86MonBrightnessUp, exec, lightctl up
# binde = , XF86MonBrightnessDown, exec, lightctl down

# Backup usando pactl (caso wpctl não funcione)
binde = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
binde = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
binde = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle

# Controle de Brilho Padrão
 bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
 bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Start the resize submap with ALT + R
bind = ALT, R, submap, resize

# Define the resize submap
submap = resize

# Hyprshot Keybindings | FIXPOINT
# bind = $mainmod, ALT, P, exec, dbus-run-session hyprshot -m region --freeze

# Set keybindings for resizing using Vim keys
binde = , h, resizeactive, -20 0   # Resize left
binde = , l, resizeactive, 20 0    # Resize right
binde = , j, resizeactive, 0 20     # Resize down
binde = , k, resizeactive, 0 -20    # Resize up

# Use escape to exit the resize submap and return to global bindings
bind = , escape, submap, reset
submap = reset

# Start the move submap with ALT + M
bind = ALT, M, submap, move

# Define the move submap
submap = move

# Set keybindings for moving using Vim keys
binde = , h, moveactive, -30 0   # Move left
binde = , l, moveactive, 30 0    # Move right
binde = , j, moveactive, 0 30     # Move down
binde = , k, moveactive, 0 -30    # Move up

# Use escape to exit the move submap and return to global bindings
bind = , escape, submap, reset
submap = reset

# Set Keybindings for Brightness controll
binde = , XF86MonBrightnessUp, exec, brightnessctl set +10%
binde = , XF86MonBrightnessDown, exec, brightnessctl set 10%-

# Screenshot management | FIXPOINT
bind = $mainMod, S, exec, dbus-run-session hyprshot -m 


##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule v1
# windowrule = float, ^(kitty)$

# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrulev2 = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrulev2 = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
